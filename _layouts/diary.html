---
layout: default
---
<nav class="breadcrumbs" aria-label="パンくずリスト">
  <a href="{{ '/' | relative_url }}">Smalltalk-2030</a>
  {% for crumb in page.breadcrumbs %}
    <span aria-hidden="true">›</span>
    {% if crumb.url %}
      <a href="{{ crumb.url | relative_url }}">{{ crumb.label }}</a>
    {% else %}
      <span aria-current="page">{{ crumb.label }}</span>
    {% endif %}
  {% endfor %}
</nav>

<header class="diary-header">
  <h1>{{ page.title }}</h1>
  {% if page.date %}
    <p class="diary-date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time></p>
  {% endif %}
</header>

{{ content }}
